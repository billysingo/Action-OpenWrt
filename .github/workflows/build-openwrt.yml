name: Build OpenWrt (LEDE)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to GitHub Releases (main branch only)'
        type: boolean
        required: false
        default: true
  push:
    branches: [main]
    paths:
      - '.config'
      - 'feeds.conf.default'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - '.github/workflows/build-openwrt.yml'
  repository_dispatch:
    types: [source-code-update]
  pull_request:
    paths:
      - '.config'
      - 'feeds.conf.default'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - '.github/workflows/build-openwrt.yml'

permissions:
  contents: read

concurrency:
  group: lede-build-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  preflight:
    name: Check repository configuration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate scripts, target and feeds
        shell: bash
        run: |
          set -euo pipefail
          bash -n diy-part1.sh diy-part2.sh
          grep -qx 'CONFIG_TARGET_x86_64=y' .config
          grep -qx 'CONFIG_GRUB_EFI_IMAGES=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-passwall2=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_All=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-passwall2_Iptables_Transparent_Proxy=y' .config
          for package in sing-box xray-core tailscale luci-app-tailscale-community luci-i18n-tailscale-community-zh-cn luci-app-statistics luci-app-sqm luci-app-qbittorrent qbittorrent; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config
          done
          grep -q '^src-git passwall_packages ' feeds.conf.default
          grep -q '^src-git passwall2 ' feeds.conf.default
          if grep -Eq '^CONFIG_PACKAGE_(luci-app-ssr-plus|luci-i18n-ssr-plus-zh-cn|qBittorrent-static|vsftpd-alt|luci-app-vsftpd|luci-app-transmission|luci-app-adbyby-plus|luci-app-unblockmusic|UnblockNeteaseMusic-Go|luci-app-turboacc|trojan|trojan-go|v2ray-core)=y$' .config; then
            echo 'Obsolete proxy app or conflicting FTP/qBittorrent variant selected' >&2
            exit 1
          fi
          if grep -Eq '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-smartdns|smartdns|luci-app-zerotier|zerotier)=y$' .config; then
            echo 'Unexpected old PassWall, SmartDNS or ZeroTier package enabled' >&2
            exit 1
          fi

  build:
    name: Compile x86_64 EFI firmware
    needs: preflight
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[publish-release]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout custom build configuration
        uses: actions/checkout@v6

      - name: Free disk space and install LEDE dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update -y
          sudo apt-get install -y             ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential             bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk             gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man             intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev             libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev             libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev             ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools             python3-setuptools qemu-utils rsync scons squashfs-tools subversion             swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd xz-utils zlib1g-dev
          df -h

      - name: Clone upstream LEDE
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "LEDE commit: $(git rev-parse HEAD)"
          echo "LEDE commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install feeds and custom packages
        shell: bash
        run: |
          set -euo pipefail
          cp feeds.conf.default openwrt/feeds.conf.default
          cd openwrt
          bash "$GITHUB_WORKSPACE/diy-part1.sh"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply and validate firmware configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .config openwrt/.config
          cd openwrt
          bash "$GITHUB_WORKSPACE/diy-part2.sh"
          cp .config .config.requested
          make defconfig
          echo '## Dropped legacy package selections (if any)' >> "$GITHUB_STEP_SUMMARY"
          comm -23             <(grep -E '^CONFIG_PACKAGE_.*=y$' .config.requested | sort)             <(grep -E '^CONFIG_PACKAGE_.*=y$' .config | sort)             | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          for package in luci-app-passwall2 luci-i18n-passwall2-zh-cn sing-box xray-core tailscale luci-app-tailscale-community luci-i18n-tailscale-community-zh-cn luci-app-statistics luci-i18n-statistics-zh-cn luci-app-sqm luci-i18n-sqm-zh-cn luci-app-qbittorrent qbittorrent; do
            if ! grep -qx "CONFIG_PACKAGE_${package}=y" .config; then
              echo "::error::Required package ${package} is unavailable after make defconfig"
              exit 1
            fi
          done
          if grep -Eq '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-smartdns|smartdns|luci-app-zerotier|zerotier)=y$' .config; then
            echo 'An excluded package reappeared after make defconfig' >&2
            exit 1
          fi
          if grep -Eq '^CONFIG_PACKAGE_(luci-app-ssr-plus|luci-i18n-ssr-plus-zh-cn|qBittorrent-static|vsftpd-alt|luci-app-vsftpd|luci-app-transmission|luci-app-adbyby-plus|luci-app-unblockmusic|UnblockNeteaseMusic-Go|luci-app-turboacc|trojan|trojan-go|v2ray-core)=y$' .config; then
            echo 'A known conflicting package was reselected by make defconfig' >&2
            exit 1
          fi
          grep -qx 'CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_All=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-passwall2_Iptables_Transparent_Proxy=y' .config
          grep -qx 'CONFIG_TARGET_x86_64=y' .config
          grep -qx 'CONFIG_GRUB_EFI_IMAGES=y' .config

      - name: Download sources
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt
          make download -j8 || make download -j1 V=s
          find dl -type f -size -1024c -print -delete

      - name: Compile firmware
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify firmware output
        shell: bash
        run: |
          set -euo pipefail
          firmware_dir="$GITHUB_WORKSPACE/openwrt/bin/targets/x86/64"
          test -d "$firmware_dir"
          if ! find "$firmware_dir" -maxdepth 1 -type f                  \( -name '*combined*efi*.img*' -o -name '*combined*efi*.vmdk' \)                  -print -quit | grep -q .; then
            echo 'No x86_64 EFI combined image was produced' >&2
            exit 1
          fi
          test -f "$firmware_dir/sha256sums"
          test -f "$firmware_dir/openwrt-x86-64-generic.manifest"
          manifest="$firmware_dir/openwrt-x86-64-generic.manifest"
          for package in luci-app-passwall2 luci-i18n-passwall2-zh-cn sing-box xray-core tailscale luci-app-tailscale-community luci-i18n-tailscale-community-zh-cn luci-app-statistics luci-app-sqm luci-app-qbittorrent qbittorrent; do
            if ! grep -Eq "^${package}[[:space:]]" "$manifest"; then
              echo "::error::Required package ${package} missing from final firmware manifest"
              exit 1
            fi
          done
          if grep -Eq '^(luci-app-ssr-plus|UnblockNeteaseMusic-Go|luci-app-transmission|luci-app-adbyby-plus|trojan|v2ray-core)[[:space:]]' "$manifest"; then
            echo "::error::A removed package was installed into the firmware"
            exit 1
          fi
          echo "## Verified manifest packages" >> "$GITHUB_STEP_SUMMARY"
          for package in luci-app-passwall2 sing-box xray-core tailscale luci-app-tailscale-community luci-app-statistics luci-app-sqm qbittorrent; do
            grep -E "^${package}[[:space:]]" "$manifest" >> "$GITHUB_STEP_SUMMARY"
          done
          rm -rf "$firmware_dir/packages"
          echo "FIRMWARE=$firmware_dir" >> "$GITHUB_ENV"
          ls -lh "$firmware_dir"
          echo "Firmware files generated: $(find "$firmware_dir" -maxdepth 1 -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: LEDE-x86_64-EFI-${{ github.run_number }}
          path: openwrt/bin/targets/x86/64/*
          if-no-files-found: error
          retention-days: 7

      - name: Generate release metadata
        id: release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'repository_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]')) || inputs.publish_release == true)
        shell: bash
        run: |
          set -euo pipefail
          tag="$(TZ=Asia/Shanghai date +'%Y.%m.%d-%H%M')-r$GITHUB_RUN_NUMBER"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          lede_sha="$(git -C openwrt rev-parse HEAD)"
          printf 'LEDE master: %s\nLEDE commit: %s\nTarget: x86_64 EFI\nProxy UI: PassWall2 (Xray + sing-box / AnyTLS)\nVPN: Tailscale + LuCI\nExcluded: PassWall 1, SSR Plus, SmartDNS, ZeroTier, UnblockNeteaseMusic\n'             "$REPO_URL" "$lede_sha" > release.txt

      - name: Publish GitHub release
        if: steps.release.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Disk usage diagnostics
        if: always()
        run: df -h
