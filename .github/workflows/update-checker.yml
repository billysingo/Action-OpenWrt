name: Update Checker

on:
  workflow_dispatch:
  # Optional automatic checks after confirming the build is stable:
  # schedule:
  #   - cron: '0 20 * * *'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Get upstream LEDE commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/coolsnowwolf/lede.git lede
          echo "sha=$(git -C lede rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Find whether this commit was previously built
        id: last
        uses: actions/cache@v6
        with:
          path: .upstream-commit
          key: lede-upstream-${{ steps.upstream.outputs.sha }}

      - name: Record commit in cache
        if: steps.last.outputs.cache-hit != 'true'
        run: echo "${{ steps.upstream.outputs.sha }}" > .upstream-commit

      - name: Dispatch firmware build
        if: steps.last.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d '{"event_type":"source-code-update"}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches"
